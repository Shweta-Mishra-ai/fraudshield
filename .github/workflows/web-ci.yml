name: Web CI

# Path-filtered: only runs when apps/web/ changes. See apps/api's
# api-ci.yml header comment for the full rationale.
on:
  push:
    branches: [main, "production-*", "feature/**"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm install
      - run: npx tsc --noEmit
      - run: npx next lint

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://fraudshield-api.onrender.com' }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm audit --audit-level=critical
