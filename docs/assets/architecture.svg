<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="650" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>
  <path d="M200 0 V650 M400 0 V650 M600 0 V650 M800 0 V650 M1000 0 V650" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Title Header -->
  <text x="600" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    FRAUDSHIELD REAL-TIME ARCHITECTURE
  </text>
  <rect x="450" y="66" width="300" height="3" rx="1.5" fill="url(#accentGlow)"/>

  <!-- CONNECTION LINES (FLOW PIPELINES) -->
  <path d="M 230 260 L 320 260" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M 520 260 L 610 260" stroke="#818cf8" stroke-width="3"/>
  <path d="M 810 260 L 890 260" stroke="#c084fc" stroke-width="3"/>
  <path d="M 710 370 L 710 440" stroke="#818cf8" stroke-width="3"/>
  <path d="M 610 500 L 460 500" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M 810 500 L 960 500" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- STAGE 1: INGESTION -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="140" width="180" height="230" rx="12" fill="url(#cardGrad1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="50" y="140" width="180" height="36" rx="12" fill="#0284c7" opacity="0.2"/>
    <text x="140" y="163" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. DATA INGESTION</text>
    
    <rect x="65" y="195" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="220" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">💳 Payment Gateways</text>
    
    <rect x="65" y="248" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="273" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">📲 REST API Ingest</text>

    <rect x="65" y="301" width="150" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="140" y="326" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">📁 Batch CSV Files</text>
  </g>

  <!-- STAGE 2: PATHWAY STREAMING ENGINE -->
  <g filter="url(#dropShadow)">
    <rect x="320" y="140" width="200" height="230" rx="12" fill="url(#cardGrad1)" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="320" y="140" width="200" height="36" rx="12" fill="#0369a1" opacity="0.3"/>
    <text x="420" y="163" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">2. PATHWAY STREAMING</text>

    <rect x="335" y="195" width="170" height="42" rx="6" fill="#0284c7" opacity="0.15" stroke="#0284c7"/>
    <text x="420" y="221" font-family="sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">⚡ Pathway Engine</text>

    <rect x="335" y="250" width="170" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="420" y="276" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Sliding Window (1h/24h)</text>

    <rect x="335" y="305" width="170" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="420" y="331" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Polling Fallback Engine</text>
  </g>

  <!-- STAGE 3: CORE FRAUD DETECTION ENGINE -->
  <g filter="url(#dropShadow)">
    <rect x="610" y="130" width="200" height="250" rx="12" fill="url(#cardGrad1)" stroke="#7c3aed" stroke-width="2"/>
    <rect x="610" y="130" width="200" height="38" rx="12" fill="#7c3aed" opacity="0.3"/>
    <text x="710" y="154" font-family="sans-serif" font-size="14" font-weight="800" fill="#a78bfa" text-anchor="middle">3. DETECTION ENGINE</text>

    <rect x="625" y="182" width="170" height="42" rx="6" fill="#5b21b6" opacity="0.3" stroke="#8b5cf6"/>
    <text x="710" y="208" font-family="sans-serif" font-size="12" font-weight="600" fill="#ddd6fe" text-anchor="middle">🤖 XGBoost + IsoForest</text>

    <rect x="625" y="234" width="170" height="42" rx="6" fill="#5b21b6" opacity="0.3" stroke="#8b5cf6"/>
    <text x="710" y="260" font-family="sans-serif" font-size="12" font-weight="600" fill="#ddd6fe" text-anchor="middle">⚡ Rule Engine (9 Rules)</text>

    <rect x="625" y="286" width="170" height="42" rx="6" fill="#5b21b6" opacity="0.3" stroke="#8b5cf6"/>
    <text x="710" y="312" font-family="sans-serif" font-size="12" font-weight="600" fill="#ddd6fe" text-anchor="middle">🕸 Network Graph Engine</text>
    
    <text x="710" y="362" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">&lt; 1ms Evaluation Latency</text>
  </g>

  <!-- STAGE 4: ACTION & DECISION -->
  <g filter="url(#dropShadow)">
    <rect x="890" y="140" width="180" height="230" rx="12" fill="url(#cardGrad1)" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="890" y="140" width="180" height="36" rx="12" fill="#e11d48" opacity="0.25"/>
    <text x="980" y="163" font-family="sans-serif" font-size="14" font-weight="700" fill="#fda4af" text-anchor="middle">4. DECISION ENGINE</text>

    <rect x="905" y="195" width="150" height="38" rx="6" fill="#15803d" opacity="0.3" stroke="#22c55e"/>
    <text x="980" y="219" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">ALLOW (Risk &lt; 0.4)</text>

    <rect x="905" y="248" width="150" height="38" rx="6" fill="#b45309" opacity="0.3" stroke="#f59e0b"/>
    <text x="980" y="272" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">FLAG / REVIEW</text>

    <rect x="905" y="301" width="150" height="38" rx="6" fill="#9f1239" opacity="0.3" stroke="#f43f5e"/>
    <text x="980" y="325" font-family="sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">BLOCK (Risk &gt; 0.7)</text>
  </g>

  <!-- API & DASHBOARDS LAYER -->
  <g filter="url(#dropShadow)">
    <rect x="460" y="440" width="350" height="120" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2"/>
    <rect x="460" y="440" width="350" height="34" rx="12" fill="#10b981" opacity="0.2"/>
    <text x="635" y="463" font-family="sans-serif" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">FASTAPI ENTERPRISE SERVICE (apps/api)</text>

    <text x="635" y="500" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Rate Limiting • API Key Auth • CORS • Security Headers</text>
    <text x="635" y="525" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">REST Endpoints: /api/v2/evaluate • /api/v2/alerts • /api/v2/stats</text>
  </g>

  <g filter="url(#dropShadow)">
    <rect x="230" y="460" width="200" height="85" rx="10" fill="url(#cardGrad1)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="330" y="492" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">🛡️ STREAMLIT DASHBOARD</text>
    <text x="330" y="516" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Live Simulation &amp; Controls</text>
  </g>

  <g filter="url(#dropShadow)">
    <rect x="840" y="460" width="200" height="85" rx="10" fill="url(#cardGrad1)" stroke="#059669" stroke-width="1.5"/>
    <text x="940" y="492" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">⚡ NEXT.JS 14 WEB APP</text>
    <text x="940" y="516" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Modern UI &amp; Analytics</text>
  </g>

  <text x="600" y="620" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    FraudShield v1.0.0 — Sub-millisecond Fraud Detection Engine with Pathway Streaming Pipeline
  </text>
</svg>
